name: CI

# Gate every push and pull request on the same checks we run locally, so a
# regression can never reach a deploy. Mirrors the "lint → typecheck → build"
# pipeline a production DTC team runs on each commit, plus offline assertions
# over catalog integrity, localization parity and crawler-visible SEO contracts.

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Kysely 0.29 (via Better Auth) requires Node 22+.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Pure, offline assertions — no database, no model, no secrets.
      - name: Catalog copy + MagSafe guards
        run: npm run check:guards

      - name: Localization catalog parity
        run: npm run i18n:check

      - name: Marketing email safety invariants
        run: npm run marketing:check

      - name: Fresh-visit preview invariants
        run: npm run preview:check

      - name: SEO metadata and schema invariants
        run: npm run seo:check

      - name: Storefront performance invariants
        run: npm run performance:check

      - name: Build
        run: npm run build
        env:
          # The build must succeed without real secrets — pages degrade to empty
          # states when services aren't configured. A placeholder keeps the
          # Next.js metadataBase / canonical URLs deterministic in CI.
          NEXT_PUBLIC_SITE_URL: https://y2kase.com

      - name: Storefront bundle budgets
        run: npm run bundle:check
